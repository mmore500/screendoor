name: ci

on:
  push:
    branches: [master, main]
    tags: ['*']
  pull_request:
    branches: ['*']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - run: python -m pip install --upgrade pip tox tox-gh-actions
    - run: tox

  bare:
    # screendoor in a bare venv, running testing/exercise end to end
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - run: |
        python -m venv /tmp/bare
        /tmp/bare/bin/pip install .
        cd /tmp && /tmp/bare/bin/python $GITHUB_WORKSPACE/scripts/bare_exercise.py

  lint:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - run: pip install -r requirements-dev/requirements-testing.txt
    - run: ./lint.sh

  pyz:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - run: ./scripts/build_pyz.sh
    - run: python3 dist/screendoor-*.pyz worker --help
    - uses: actions/upload-artifact@v4
      with:
        name: screendoor-pyz
        path: dist/*.pyz

  docker:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
    - uses: actions/checkout@v4
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/build-push-action@v6
      with:
        push: true
        tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
