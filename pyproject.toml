[project]
authors = [
  {name = "Matthew Andres Moreno", email="m.more500@gmail.com"},
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
# standard library only
dependencies = []
description = "Dynamic screens (knockouts, ablations, sweeps) driven by append-only JSONL records."
license = "MIT"
license-files = ["LICENSE"]
name = "screendoor"
keywords = ["screendoor", "slurm", "knockout", "screen"]
requires-python = ">=3.10"
version = "0.1.1"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
homepage = "https://github.com/mmore500/screendoor"
repository = "https://github.com/mmore500/screendoor"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*.pyi"]

[tool.setuptools.packages.find]
exclude = ["tests", "tests.*", "examples", "examples.*"]
namespaces = false

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools >= 77.0.0"]

[project.optional-dependencies]
testing = [
  "coverage>=7.6.1",
  "pytest-xdist==2.5.0",
  "pytest==8.3.3",
  "sybil>=6.1.1",
  "black==22.10.0",
  "isort==5.12.0",
  "ruff==0.1.11",
]
docs = ["sybil>=6.1.1"]
release = [
  "build>=1.2.2",
  "bumpver==2023.1129",
  "setuptools>=77.0.0",
  "twine==6.0.1",
  "uv>=0.4.18",
  "wheel>=0.45.0",
]

[tool.black]
line-length = 79

[tool.isort]
force_sort_within_sections = true
line_length = 79
profile = "black"
skip_gitignore = true
