[bumpver]
current_version = "v0.1.1"
version_pattern = "vMAJOR.MINOR.PATCH"
commit = True
tag = True

[bumpver:file_patterns]
screendoor/__init__.py =
  __version__ = "{pep440_version}"
CITATION.cff =
  version: {pep440_version}
pyproject.toml =
  version = "{pep440_version}"
README.md =
  docker://ghcr.io/mmore500/screendoor:v{pep440_version}

[aliases]
test = pytest
