[tox]
envlist = py310, py311, py312, py313, py314, bare
isolated_build = True

[testenv]
deps = -r requirements-dev/requirements-testing.txt
commands = pytest -q {posargs}

[testenv:bare]
# screendoor alone, in a venv with nothing else: a stray third-party import
# fails here
deps =
skip_install = false
commands =
  python -c "import screendoor, screendoor.daemon, screendoor.worker"
  python {toxinidir}/scripts/bare_exercise.py

[coverage:run]
source = screendoor

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314, bare
