[tox]
envlist = py310, py311, py312, py313, py314, bare
isolated_build = True

[testenv]
commands = pytest -q {posargs}

[testenv:py310]
deps = -r{toxinidir}/requirements-dev/py310/requirements-testing.txt

[testenv:py311]
deps = -r{toxinidir}/requirements-dev/py311/requirements-testing.txt

[testenv:py312]
deps = -r{toxinidir}/requirements-dev/py312/requirements-testing.txt

[testenv:py313]
deps = -r{toxinidir}/requirements-dev/py313/requirements-testing.txt

[testenv:py314]
deps = -r{toxinidir}/requirements-dev/py314/requirements-testing.txt

[testenv:bare]
# screendoor alone, in a venv with nothing else: a stray third-party import
# fails here
deps =
skip_install = false
commands =
  python -c "import screendoor, screendoor.daemon, screendoor.trial.worker"
  python {toxinidir}/scripts/bare_exercise.py

[coverage:run]
source = screendoor

[coverage:report]
exclude_lines =
  # Have to re-enable the standard pragma
  pragma: no cover

  # Don't complain if tests don't hit defensive assertion code:
  raise AssertionError
  raise NotImplementedError

  # Don't complain about type-checking-only imports or entry points:
  if typing.TYPE_CHECKING:
  if __name__ == .__main__.:

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314, bare
